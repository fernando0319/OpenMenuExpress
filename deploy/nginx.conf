# OpenMenuExpress — nginx site. Replace /var/www/menu-express with the app directory and
# php8.4-fpm.sock with the PHP-FPM socket of the server (aaPanel: /tmp/php-cgi-84.sock).
# Replace seudominio.com.br with your domain.
#
# With Cloudflare in front (proxy on), use a Cloudflare Origin Certificate for
# seudominio.com.br and set SSL mode to "Full (strict)".

server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.25+ prefers "http2 on;", but this form also works on Ubuntu 24.04's 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seudominio.com.br;

    ssl_certificate     /etc/ssl/menu-express/fullchain.pem;
    ssl_certificate_key /etc/ssl/menu-express/privkey.pem;

    root /var/www/menu-express/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets and uploaded pictures change name when they change.
    location ~* ^/(build|storage)/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Laravel sends a Link header to preload every page asset; the default buffer is too small.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
