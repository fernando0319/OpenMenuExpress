; OpenMenuExpress queue worker (WhatsApp messages, printing and other background jobs).
; Copy to /etc/supervisor/conf.d/menu-express.conf (aaPanel: Supervisor manager, same command),
; then: supervisorctl reread && supervisorctl update
[program:menu-express-queue]
command=php /var/www/menu-express/current/artisan queue:work --sleep=2 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/menu-express/shared/storage/logs/queue.log
stopwaitsecs=60
