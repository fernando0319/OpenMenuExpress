name: desktop

# Builds the Windows panel app (desktop/) and publishes it to the server's storage:
#   storage/desktop/OpenMenuExpress-Setup.exe  — the installer offered in the panel
#   storage/desktop/latest.json             — read by installed apps to update themselves
# Each build gets version 1.0.<run number>, so installed apps always see it as newer.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) sign the updates; DEPLOY_* as in deploy.yml.
# Variable DEPLOY_APP_URL is the server the app opens.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build installer
        env:
          MX_SERVER_URL: ${{ vars.DEPLOY_APP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          npm ci
          npx tauri build --config "{\"version\":\"$VERSION\"}"
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/OpenMenuExpress-Setup.exe
          SIG=$(cat src-tauri/target/release/bundle/nsis/*-setup.exe.sig)
          node -e '
            const [version, signature, server] = process.argv.slice(1);
            const manifest = {
              version,
              notes: "Nova versão do OpenMenuExpress.",
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature, url: `${server}/storage/desktop/OpenMenuExpress-Setup.exe` } },
            };
            require("fs").writeFileSync("out/latest.json", JSON.stringify(manifest, null, 2));
          ' "$VERSION" "$SIG" "${MX_SERVER_URL%/}"

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: menu-express-painel
          path: desktop/out/
          retention-days: 30

      - name: Publish to the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ vars.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          DEST="$APP_DIR/shared/storage/app/public/desktop"
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "mkdir -p '$DEST'"
          # Installer first, manifest last: apps never see a version whose file is not there yet.
          scp -i ~/.ssh/id_deploy out/OpenMenuExpress-Setup.exe "$USER@$HOST:$DEST/OpenMenuExpress-Setup.exe.tmp"
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "mv '$DEST/OpenMenuExpress-Setup.exe.tmp' '$DEST/OpenMenuExpress-Setup.exe'"
          scp -i ~/.ssh/id_deploy out/latest.json "$USER@$HOST:$DEST/latest.json"
